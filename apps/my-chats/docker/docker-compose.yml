services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_chats
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

  server:
    build:
      context: ../../..
      dockerfile: apps/my-chats/docker/server.Dockerfile
    env_file: ../server/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: my_chats
      DB_SYNCHRONIZE: 'true'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: ../../..
      dockerfile: apps/my-chats/docker/web.Dockerfile
    depends_on:
      - server
    ports:
      - '3201:80'
    restart: unless-stopped

volumes:
  pgdata:
