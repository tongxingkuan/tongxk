# 宿主机 nginx 配置参考：my-chats 子域名反代到 web 容器（端口 3201）
#
# 本文件由 build.sh 在 my-chats 变更时自动同步到 /etc/nginx/conf.d/chat.conf，
# 并执行 nginx -t 校验 + reload（校验失败则不 reload，保护主站）。
#
# HTTPS 证书需先放到服务器（由 acme.sh 自动签发并安装到此处）：
#   /etc/nginx/ssl/chat.tongxingkuan.xin.pem
#   /etc/nginx/ssl/chat.tongxingkuan.xin.key
# 证书未就位时，nginx -t 会失败并保持旧配置（不影响主站，也不影响已跑的容器）。
#
# 该 server 块按 server_name 与主站 tongxingkuan.xin 隔离，互不影响。

# HTTP → HTTPS 跳转
server {
  listen 80;
  server_name chat.tongxingkuan.xin;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name chat.tongxingkuan.xin;

  ssl_certificate     /etc/nginx/ssl/chat.tongxingkuan.xin.pem;
  ssl_certificate_key /etc/nginx/ssl/chat.tongxingkuan.xin.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  # 静态资源 / SPA / /api 全部透传到 my-chats 的 web 容器
  location / {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE：必须关闭缓冲并拉长超时，否则流式回复会被截断
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
