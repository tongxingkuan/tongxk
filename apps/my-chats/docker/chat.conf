# 宿主机 nginx 配置参考：my-chats 子域名反代到 web 容器（端口 3201）
#
# 部署方法（在阿里云服务器上）：
#   cp apps/my-chats/docker/chat.conf /etc/nginx/conf.d/chat.conf
#   nginx -t && nginx -s reload
#
# 该 server 块按 server_name 与主站 tongxingkuan.xin 隔离，互不影响。
server {
  listen 80;
  server_name chat.tongxingkuan.xin;

  # 静态资源 / SPA / /api 全部透传到 my-chats 的 web 容器
  location / {
    proxy_pass http://127.0.0.1:3201;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE：必须关闭缓冲并拉长超时，否则流式回复会被截断
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
}
